<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <!-- Replaced by the value of `flutter build web --base-href`. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="منظم دراستي — نظّم حياتك الجامعية: الجدول، المذاكرة، التاسكات، الكويزات، المشاريع والدرجات.">
  <meta name="theme-color" content="#6C5CE7">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="منظم دراستي">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>منظم دراستي</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #F5F4FB; }
    @media (prefers-color-scheme: dark) {
      html, body { background: #110F1A; }
    }
    #loading {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
      color: #6C5CE7;
    }
    #loading img { width: 96px; height: 96px; border-radius: 26px;
      box-shadow: 0 12px 30px rgba(108, 92, 231, .35); }
    #loading .bar { width: 160px; height: 6px; border-radius: 6px;
      background: rgba(108, 92, 231, .15); overflow: hidden; }
    #loading .bar::after { content: ""; display: block; width: 40%; height: 100%;
      border-radius: 6px; background: #6C5CE7;
      animation: slide 1.1s ease-in-out infinite; }
    @keyframes slide { from { transform: translateX(-160px); } to { transform: translateX(160px); } }
  </style>
</head>
<body>
  <div id="loading">
    <img src="icons/Icon-192.png" alt="">
    <div style="font-size: 20px; font-weight: 700;">منظم دراستي</div>
    <div class="bar"></div>
  </div>
  <script>
    {{flutter_js}}
    {{flutter_build_config}}
    _flutter.loader.load({
      onEntrypointLoaded: async function (engineInitializer) {
        const appRunner = await engineInitializer.initializeEngine();
        await appRunner.runApp();
        document.getElementById("loading")?.remove();
      },
    });
  </script>
</body>
</html>
